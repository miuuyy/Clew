<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Clew is an AI-native workspace for structured learning with explicit proposals, snapshots, quizzes, and rollbackable state." />
  <meta name="keywords" content="graph learning, knowledge graph, study graph, AI study workspace, proposal review, snapshots, local-first learning" />
  <meta name="robots" content="index,follow" />
  <meta name="theme-color" content="#050505" />
  <meta name="color-scheme" content="dark" />
  <meta name="application-name" content="Clew" />
  <meta name="apple-mobile-web-app-title" content="Clew" />
  <meta name="format-detection" content="telephone=no" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Clew" />
  <meta property="og:title" content="Clew Workspace" />
  <meta property="og:description" content="AI-native workspace for structured learning with explicit proposals, snapshots, quizzes, and rollbackable state." />
  <meta property="og:image" content="/clew-favicon-light-accent.png?v=2" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Clew Workspace" />
  <meta name="twitter:description" content="AI-native workspace for structured learning with explicit proposals, snapshots, quizzes, and rollbackable state." />
  <meta name="twitter:image" content="/clew-favicon-light-accent.png?v=2" />
  <link rel="canonical" href="/" />
  <link rel="icon" href="/clew-mark.svg" />
  <link rel="apple-touch-icon" href="/clew-mark.svg" />
  <link rel="manifest" href="/site.webmanifest" />
  <title>Clew Workspace</title>
  <style>
    html, body, #root {
      margin: 0;
      background: #000000;
    }
    html[data-theme="light"], html[data-theme="light"] body, html[data-theme="light"] #root {
      background: #ffffff;
    }
    html[data-theme="light"] #root .app,
    html[data-theme="light"] #root .main,
    html[data-theme="light"] #root .workspaceShell,
    html[data-theme="light"] #root .workspaceMain,
    html[data-theme="light"] #root .neuroGraphShell,
    html[data-theme="light"] #root .neuroGraphSurface,
    html[data-theme="light"] #root .neuroGraphCanvas {
      background: #ffffff;
    }
    html[data-theme="dark"] #root .app,
    html[data-theme="dark"] #root .main,
    html[data-theme="dark"] #root .workspaceShell,
    html[data-theme="dark"] #root .workspaceMain,
    html[data-theme="dark"] #root .neuroGraphShell,
    html[data-theme="dark"] #root .neuroGraphSurface,
    html[data-theme="dark"] #root .neuroGraphCanvas {
      background: #000000;
    }

    /* Inline brand launch loader — appears the moment the browser has HTML,
       before any JS executes, and stays until React finishes mounting. */
    .clewLaunchInline {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      z-index: 9999;
    }
    html[data-theme="dark"] .clewLaunchInline { background: #000000; }

    .clewLaunchInline svg {
      width: 56px;
      height: 56px;
      color: #d97757;
    }
    html[data-theme="dark"] .clewLaunchInline svg { color: #ffffff; }

    .clewLaunchFillPath { fill: currentColor; stroke: none; }

    /* Mask-reveal technique: a second copy of the path lives inside an SVG
       <mask>, rendered as a very thick white stroke. Animating that stroke's
       dashoffset reveals the underlying filled path along the path's own
       trajectory — not top-down, not a box slide. Forward (100 → 0) fills
       the logo along the path; backward (0 → 100) erases along the same
       path from the tip. One cycle = one draw + one un-draw. */
    .clewLaunchMaskStroke {
      fill: none;
      stroke: white;
      stroke-width: 400;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: clewLaunchTrace 2.8s linear infinite;
    }

    @keyframes clewLaunchTrace {
      0%   { stroke-dashoffset: 100; }
      35%  { stroke-dashoffset: 0;   }
      100% { stroke-dashoffset: 100; }
    }
  </style>
  <script src="/theme-init.js"></script>
</head>

<body>
  <div id="root">
    <div class="clewLaunchInline" aria-label="Loading">
      <svg viewBox="0 0 1254 1254" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>

          <mask id="clewLaunchMask" maskUnits="userSpaceOnUse" x="-500" y="-500" width="2254" height="2254">
            <rect x="-500" y="-500" width="2254" height="2254" fill="black" />
            <use href="/clew-mark.svg#clewShape" class="clewLaunchMaskStroke" />
          </mask>
        </defs>
        <use href="/clew-mark.svg#clewShape" class="clewLaunchFillPath" mask="url(#clewLaunchMask)" />
      </svg>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
