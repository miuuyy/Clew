[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clew-backend"
version = "1.0.0"
description = "Backend for the Clew graph-first learning workspace"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.32.0,<1.0.0",
  "pydantic>=2.10.0,<3.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "httpx>=0.28.0,<1.0.0",
  "mcp>=1.2.0,<2.0.0",
  "keyring>=25.0.0,<26.0.0",
  "PyJWT[crypto]>=2.9.0,<3.0.0"
]

[project.scripts]
clew-study-assist = "app.mcp_server.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
